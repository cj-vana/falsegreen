name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed, then moves the major tag (v1) to it and
# creates the GitHub release. npm prefers trusted publishing (OIDC) when a trusted publisher for
# this workflow is configured on npmjs.com, and falls back to the NPM_TOKEN secret otherwise. A
# trusted publisher can only be added to a package that already exists, so the first publish needs
# NPM_TOKEN or a manual `npm publish`. The pattern leaves out the major tags this workflow moves.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  gate:
    name: every gate, every toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FALSEGREEN_REQUIRE_TOOLCHAINS: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify the tag matches the package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - uses: oven-sh/setup-bun@v2

      - run: npm ci
      - run: scripts/toolchains.sh
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1. No package cache in the publish
      # job, as npm's trusted-publishing guide advises.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run build

      - name: Pack the release artifact
        id: package
        run: echo "path=$GITHUB_WORKSPACE/$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      - name: Commit a copy of the js-vitest fixture
        run: |
          mkdir -p tmp
          cp -R test/fixtures/js-vitest tmp/smoke
          rm tmp/smoke/expected.json
          git -C tmp/smoke init -q
          git -C tmp/smoke add -A
          git -C tmp/smoke -c user.name=falsegreen -c user.email=falsegreen@example.invalid commit -qm fixture

      # The same check as the CI action job, on the tarball that is about to be published.
      - name: Run the packed artifact through the action
        id: smoke
        continue-on-error: true
        uses: ./
        with:
          version: file:${{ steps.package.outputs.path }}
          node-version: ''
          args: -C tmp/smoke
          upload-report: 'false'

      - name: Check the action outputs
        env:
          EXIT_CODE: ${{ steps.smoke.outputs.exit-code }}
          FINDINGS: ${{ steps.smoke.outputs.findings }}
          DEAD_GATES: ${{ steps.smoke.outputs.dead-gates }}
        run: |
          test "$EXIT_CODE" = 1
          test "$FINDINGS" = 2
          test "$DEAD_GATES" = 1

      # The tarball that passed the smoke test is the one that ships.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE: ${{ steps.package.outputs.path }}
        run: npm publish "$PACKAGE" --provenance --access public

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # move the major tag and create the release
    steps:
      - uses: actions/checkout@v7

      # `uses: cj-vana/falsegreen@v1` follows the newest v1.x.y. Moved only after the npm publish,
      # because the action installs the version named in its own package.json.
      - name: Move the major tag
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
