name: CI
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go test -coverprofile=coverage.out ./...
      - run: go test -run TestAdd ./...
      - run: go vet ./...
