name: CI
on: push
jobs:
  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go install golang.org/x/tools/cmd/goimports@v0.50.0
      - run: goimports -l .
      - run: goimports -d .
      - name: goimports clean
        run: |
          out=$(goimports -l .)
          test -z "$out" || { echo "$out"; exit 1; }
