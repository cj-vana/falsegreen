name: CI
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pytest -q
      - run: python -m pytest -q || true
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s legacy -p '*_spec.py'
      - run: python -m unittest tests.test_calc
